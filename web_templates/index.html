<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoho Mailer 2.0 Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; margin-bottom: 20px; }
        .form-control, .form-select { background-color: #2b2b2b; color: #fff; border: 1px solid #444; }
        .form-control:focus, .form-select:focus { background-color: #333; color: #fff; box-shadow: none; border-color: #0d6efd; }
        .log-box { height: 250px; overflow-y: auto; background-color: #000; color: #0f0; font-family: monospace; padding: 10px; font-size: 14px; border: 1px solid #333;}
    </style>
</head>
<body>
<div class="container py-4">
    <h2 class="text-center mb-4">Zoho Mailer 2.0 Web</h2>
    
    <div class="row">
        <!-- Podesavanja -->
        <div class="col-md-6">
            <div class="card p-3">
                <h5 class="card-title text-primary">1. SMTP Konekcija (Zoho)</h5>
                <div class="mb-2">
                    <input type="email" id="email" class="form-control" placeholder="Tvoj Zoho Email" value="{{ config.email }}">
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Lozinka / App Password" value="{{ config.password }}">
                </div>

                <h5 class="card-title text-primary mt-3">2. Podešavanje Kampanje</h5>
                <div class="mb-2">
                    <input class="form-control" type="file" id="excelFile" accept=".xlsx">
                    <small class="text-muted">Prvo izaberi Excel fajl ovde.</small>
                </div>
                
                <div class="row mb-2">
                    <div class="col-4">
                        <label>Limit/dan:</label>
                        <input type="number" id="limit" class="form-control" value="{{ config.limit }}">
                    </div>
                    <div class="col-4">
                        <label>Od (h):</label>
                        <input type="number" id="start_hour" class="form-control" value="{{ config.start_hour }}">
                    </div>
                    <div class="col-4">
                        <label>Do (h):</label>
                        <input type="number" id="end_hour" class="form-control" value="{{ config.end_hour }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label>Jezik:</label>
                    <select id="language" class="form-select">
                        <option value="Engleski" {% if config.language == 'Engleski' %}selected{% endif %}>Engleski</option>
                        <option value="Srpskohrvatski" {% if config.language == 'Srpskohrvatski' %}selected{% endif %}>Srpskohrvatski</option>
                    </select>
                </div>

                <h5 class="card-title text-primary mt-3">3. Baza</h5>
                <p class="text-success" id="dbTotal">Ukupno poslatih adresa: Učitavam...</p>
            </div>
        </div>

        <!-- Kontrole i Logovi -->
        <div class="col-md-6">
            <div class="card p-3">
                <h5 class="card-title text-primary">Kontrole</h5>
                <div class="d-flex gap-2 mb-3">
                    <button id="btnStart" class="btn btn-success flex-grow-1" onclick="startCampaign()">▶ START</button>
                    <button id="btnPause" class="btn btn-warning flex-grow-1" onclick="pauseCampaign()" disabled>⏸ PAUZA</button>
                    <button id="btnStop" class="btn btn-danger flex-grow-1" onclick="stopCampaign()" disabled>⏹ STOP</button>
                </div>

                <div class="progress mb-3" style="height: 20px; background-color: #333;">
                    <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%">0%</div>
                </div>

                <div id="logBox" class="log-box">Logovi će se pojaviti ovde...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let uploadedFilePath = null;
    let statusInterval = null;

    async function uploadExcel() {
        const fileInput = document.getElementById('excelFile');
        if (fileInput.files.length === 0) return null;
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        
        try {
            const response = await fetch('/upload', { method: 'POST', body: formData });
            const data = await response.json();
            if (data.success) {
                uploadedFilePath = data.filepath;
                return true;
            } else {
                alert(data.error);
                return false;
            }
        } catch (e) {
            alert("Greška pri uploadu.");
            return false;
        }
    }

    async function startCampaign() {
        // Prvo upload fajla ako je izabran
        const fileInput = document.getElementById('excelFile');
        if (fileInput.files.length > 0) {
            document.getElementById('btnStart').innerText = "Otpremanje fajla...";
            const uploaded = await uploadExcel();
            if (!uploaded) {
                document.getElementById('btnStart').innerText = "▶ START";
                return;
            }
        }

        if (!uploadedFilePath) {
            alert("Morate prvo izabrati Excel fajl!");
            return;
        }

        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            limit: document.getElementById('limit').value,
            start_hour: document.getElementById('start_hour').value,
            end_hour: document.getElementById('end_hour').value,
            language: document.getElementById('language').value,
            filepath: uploadedFilePath
        };

        const response = await fetch('/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        if (data.success) {
            document.getElementById('btnStart').innerText = "▶ START";
            updateUI(true, false);
        } else {
            document.getElementById('btnStart').innerText = "▶ START";
            alert(data.error);
        }
    }

    async function pauseCampaign() {
        const response = await fetch('/pause', { method: 'POST' });
        const data = await response.json();
        if (data.success) {
            if (data.is_paused) {
                document.getElementById('btnPause').innerText = "▶ NASTAVI";
                document.getElementById('btnPause').classList.replace('btn-warning', 'btn-success');
            } else {
                document.getElementById('btnPause').innerText = "⏸ PAUZA";
                document.getElementById('btnPause').classList.replace('btn-success', 'btn-warning');
            }
        }
    }

    async function stopCampaign() {
        if(confirm("Da li sigurno želite da zaustavite slanje?")) {
            await fetch('/stop', { method: 'POST' });
            updateUI(false, false);
        }
    }

    async function fetchStatus() {
        try {
            const response = await fetch('/status');
            const data = await response.json();
            
            // Azuriraj logove
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = data.logs.join('<br>');
            logBox.scrollTop = logBox.scrollHeight;

            // Azuriraj progress
            const prog = Math.round(data.progress * 100);
            const pBar = document.getElementById('progressBar');
            pBar.style.width = prog + '%';
            pBar.innerText = prog + '%';

            // Azuriraj bazu
            document.getElementById('dbTotal').innerText = `Ukupno jedinstvenih adresa u bazi: ${data.total_db}`;

            updateUI(data.is_running, data.is_paused);
        } catch (e) {
            console.error("Ne mogu da dohvatim status", e);
        }
    }

    function updateUI(isRunning, isPaused) {
        document.getElementById('btnStart').disabled = isRunning;
        document.getElementById('btnPause').disabled = !isRunning;
        document.getElementById('btnStop').disabled = !isRunning;
        
        if (!isRunning) {
            document.getElementById('btnPause').innerText = "⏸ PAUZA";
            document.getElementById('btnPause').classList.replace('btn-success', 'btn-warning');
        } else {
            if (isPaused) {
                document.getElementById('btnPause').innerText = "▶ NASTAVI";
                document.getElementById('btnPause').classList.replace('btn-warning', 'btn-success');
            } else {
                document.getElementById('btnPause').innerText = "⏸ PAUZA";
                document.getElementById('btnPause').classList.replace('btn-success', 'btn-warning');
            }
        }
    }

    // Ping status every second
    setInterval(fetchStatus, 1000);
    fetchStatus(); // fetch once immediately
</script>
</body>
</html>
